workflows:
  ios-build-check:
    name: iOS Build Check
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_PROJECT: "MyHighSchoolJourney.xcodeproj"
        XCODE_SCHEME: "HighSchoolJourney"

    scripts:
      - name: Show build environment
        script: |
          echo "Xcode version:"
          xcodebuild -version
          echo "Swift version:"
          swift --version

      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate project and build
        script: |
          set -o pipefail

          APP_FILE=$(find "$CM_BUILD_DIR" -maxdepth 3 -name HighSchoolJourneyApp.swift -print -quit)

          if [ -z "$APP_FILE" ]; then
            echo "ERROR: HighSchoolJourneyApp.swift was not found in the repository."
            find "$CM_BUILD_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

          APP_SOURCE_DIR=$(dirname "$APP_FILE")
          echo "App source found at: $APP_SOURCE_DIR"

          if [ "$APP_SOURCE_DIR" != "$CM_BUILD_DIR" ]; then
            cp "$CM_BUILD_DIR/project.yml" "$APP_SOURCE_DIR/project.yml"
            if [ -d "$CM_BUILD_DIR/Resources" ]; then
              rm -rf "$APP_SOURCE_DIR/Resources"
              cp -R "$CM_BUILD_DIR/Resources" "$APP_SOURCE_DIR/Resources"
            fi
          fi

          cd "$APP_SOURCE_DIR"
          xcodegen generate --spec project.yml

          echo "Building for the iOS Simulator..."
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/xcodebuild.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "============================================================"
            echo "COMPILER ERRORS FOUND"
            echo "============================================================"
            grep -n -E -B 5 -A 8 '(^|[[:space:]])error:' "$CM_BUILD_DIR/xcodebuild.log" || true
            echo "============================================================"
            exit "$BUILD_STATUS"
          fi

          echo "Build succeeded."

    artifacts:
      - xcodebuild.log
      - build/Build/Products/Debug-iphonesimulator/*.app
      - build/Logs/**/*.xcactivitylog

  ios-signed-build:
    name: iOS Signed Build
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.scriptingforschools.MyHighSchoolJourney
      vars:
        XCODE_PROJECT: "MyHighSchoolJourney.xcodeproj"
        XCODE_SCHEME: "HighSchoolJourney"
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate project and set build number
        script: |
          set -e

          APP_FILE=$(find "$CM_BUILD_DIR" -maxdepth 3 -name HighSchoolJourneyApp.swift -print -quit)
          if [ -z "$APP_FILE" ]; then
            echo "ERROR: HighSchoolJourneyApp.swift was not found in the repository."
            exit 1
          fi

          APP_SOURCE_DIR=$(dirname "$APP_FILE")
          if [ "$APP_SOURCE_DIR" != "$CM_BUILD_DIR" ]; then
            cp "$CM_BUILD_DIR/project.yml" "$APP_SOURCE_DIR/project.yml"
            if [ -d "$CM_BUILD_DIR/Resources" ]; then
              rm -rf "$APP_SOURCE_DIR/Resources"
              cp -R "$CM_BUILD_DIR/Resources" "$APP_SOURCE_DIR/Resources"
            fi
          fi

          cd "$APP_SOURCE_DIR"
          xcodegen generate --spec project.yml

          IOS_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          echo "Setting iOS build number to $IOS_BUILD_NUMBER"
          xcrun agvtool new-version -all "$IOS_BUILD_NUMBER"

          echo "Verifying build number..."
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings | grep -E 'CURRENT_PROJECT_VERSION|MARKETING_VERSION|PRODUCT_BUNDLE_IDENTIFIER'

          echo "Applying Codemagic provisioning profile and signing certificate..."
          xcode-project use-profiles --project "$XCODE_PROJECT"

          echo "Building signed IPA..."
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  ios-testflight-upload:
    name: iOS TestFlight Upload
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: app_store_connect

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.scriptingforschools.MyHighSchoolJourney
      vars:
        XCODE_PROJECT: "MyHighSchoolJourney.xcodeproj"
        XCODE_SCHEME: "HighSchoolJourney"
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate project, set build number, and create signed IPA
        script: |
          set -e

          APP_FILE=$(find "$CM_BUILD_DIR" -maxdepth 3 -name HighSchoolJourneyApp.swift -print -quit)
          if [ -z "$APP_FILE" ]; then
            echo "ERROR: HighSchoolJourneyApp.swift was not found in the repository."
            exit 1
          fi

          APP_SOURCE_DIR=$(dirname "$APP_FILE")
          if [ "$APP_SOURCE_DIR" != "$CM_BUILD_DIR" ]; then
            cp "$CM_BUILD_DIR/project.yml" "$APP_SOURCE_DIR/project.yml"
            if [ -d "$CM_BUILD_DIR/Resources" ]; then
              rm -rf "$APP_SOURCE_DIR/Resources"
              cp -R "$CM_BUILD_DIR/Resources" "$APP_SOURCE_DIR/Resources"
            fi
          fi

          cd "$APP_SOURCE_DIR"
          xcodegen generate --spec project.yml

          IOS_BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}"
          echo "Setting iOS build number to $IOS_BUILD_NUMBER"
          xcrun agvtool new-version -all "$IOS_BUILD_NUMBER"

          echo "Verifying version settings before archive..."
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings | grep -E 'CURRENT_PROJECT_VERSION|MARKETING_VERSION|PRODUCT_BUNDLE_IDENTIFIER'

          echo "Applying Codemagic provisioning profile and signing certificate..."
          xcode-project use-profiles --project "$XCODE_PROJECT"

          echo "Building IPA for TestFlight..."
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

          IPA_PATH=$(find "$APP_SOURCE_DIR/build/ios/ipa" -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "Verifying packaged Info.plist..."
          rm -rf /tmp/hsj_ipa_check
          mkdir -p /tmp/hsj_ipa_check
          unzip -q "$IPA_PATH" -d /tmp/hsj_ipa_check
          APP_PATH=$(find /tmp/hsj_ipa_check/Payload -maxdepth 1 -name '*.app' -print -quit)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"

    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
