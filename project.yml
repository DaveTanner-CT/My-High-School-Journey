name: MyHighSchoolJourney

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

configs:
  Debug: debug
  Release: release

targets:
  HighSchoolJourney:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HighSchoolJourneyApp.swift
      - path: Architecture
      - path: Components
      - path: Models
      - path: Services
      - path: Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scriptingforschools.MyHighSchoolJourney
        PRODUCT_NAME: HighSchoolJourney
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: My High School Journey
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  HighSchoolJourney:
    build:
      targets:
        HighSchoolJourney: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
