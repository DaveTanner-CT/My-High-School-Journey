name: MyHighSchoolJourney

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

configs:
  Debug: debug
  Release: release

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0

targets:
  HighSchoolJourney:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HighSchoolJourneyApp.swift
      - path: Architecture
      - path: Components
      - path: Models
      - path: Services
      - path: Views
      - path: Resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scriptingforschools.MyHighSchoolJourney
        PRODUCT_NAME: HighSchoolJourney
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        VERSIONING_SYSTEM: apple-generic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: My High School Journey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Use Face ID to unlock your private High School Journey.
        GoogleOAuthClientID: 226318971031-tjcon2k5cuh2bsnga0nqute6mk0r3u3.apps.googleusercontent.com
        GIDClientID: 226318971031-tjcon2k5cuh2bsnga0nqute6mk0r3u3.apps.googleusercontent.com
        GoogleOAuthRedirectScheme: com.googleusercontent.apps.226318971031-tjcon2k5cuh2bsnga0nqute6mk0r3u3
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.226318971031-tjcon2k5cuh2bsnga0nqute6mk0r3u3
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  HighSchoolJourney:
    build:
      targets:
        HighSchoolJourney: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
